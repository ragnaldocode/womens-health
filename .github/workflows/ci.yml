name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24' # >=22.18 para importar .ts direto no script de verificação
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Verificar lógica de domínio
        run: npm run verify

      - name: Build web (smoke test do bundle)
        run: npx expo export -p web --output-dir dist
